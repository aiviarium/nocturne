StylesPath = .vale/styles
MinAlertLevel = suggestion

# The AI-tell and voice rules are vendored in .vale/styles, the same copies
# the organisation's other repositories use.

[*.{md,mdx}]
BasedOnStyles = Vale, ai-tells, Voices
ai-tells = warning
ai-tells.EmDashUsage = error
ai-tells.OverusedVocabulary = error
ai-tells.PromotionalPuffery = error
Vale.Spelling = NO

# Vendored styles, the adopted code of conduct, licences and installed or built files aren't ours to word.
[{.vale/**,CODE_OF_CONDUCT.md,site/LICENSE-*,**/node_modules/**,site/.next/**,site/out/**,site/.source/**}]
BasedOnStyles =
