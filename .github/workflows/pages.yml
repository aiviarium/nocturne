name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history gives each page its "Last updated" date.
          fetch-depth: 0
      # Where Pages serves the site: a folder named after the repository on
      # github.io, the root on a domain of its own.
      - id: pages
        uses: actions/configure-pages@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The site builds the gallery from the library, which needs its dependencies too.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile && bun run build
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out
  # Needs Pages with the source "GitHub Actions" in the repository's settings.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
